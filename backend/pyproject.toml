[project]
name = "clinicflow-backend"
version = "0.1.0"
description = "ClinicFlow FastAPI backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "asyncpg>=0.30.0",
  "bcrypt>=5.0.0",
  "email-validator>=2.3.0",
  "fastapi[standard]>=0.119.0",
  "pyjwt>=2.10.1",
  "pydantic-settings>=2.11.0",
  "python-json-logger>=3.3.0",
  "sqlalchemy>=2.0.44",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0",
  "black>=25.9.0",
  "httpx>=0.28.1",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
